<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta property="og:site_name" content="theesirichai">
    <meta property="og:type" content="article">
    <meta property="og:title" content="Post | theesirichai">
    <meta property="og:description" content="บทความและบันทึกของ ธีร์ ดำรงศิริชัย (Thee Dumrongsirichai)">
    <meta property="og:url" content="https://theesirichai.github.io/post.html">
    <meta property="og:image" content="https://theesirichai.github.io/favicon.svg">
    <meta name="twitter:card" content="summary">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;600&family=Inter:wght@300;400;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="style.css?v=17">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>

    <aside class="left-sidebar">
        <img src="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20200%20200%22%20fill%3D%22none%22%3E%3Crect%20width%3D%22200%22%20height%3D%22200%22%20fill%3D%22%23e5dfd3%22%2F%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%2278%22%20r%3D%2234%22%20fill%3D%22%23a39b8e%22%2F%3E%3Cpath%20d%3D%22M40%20176c0-33.137%2026.863-60%2060-60s60%2026.863%2060%2060%22%20fill%3D%22%23a39b8e%22%2F%3E%3C%2Fsvg%3E" alt="Profile Image" class="profile-img">
        <h1 class="profile-name">THEE D.</h1>
        <p class="profile-bio">Developer & Creator | TU-8505-CS</p>
        <div class="social-links"></div>
    </aside>

    <main class="right-content">
        <div class="top-nav-row">
            <nav class="nav-menu">
                <a href="index.html">Home</a>
                <a href="posts.html" class="active">Posts</a>
                <a href="about.html">About Me</a>
                <a href="project.html">Project</a>
            </nav>

            <div class="admin-bar">
                <span id="admin-status"></span>
                <button type="button" id="btn-open-login" class="btn-minimal" title="สำหรับเจ้าของเว็บเพื่อแก้ไขบทความ">
                    <i class="fa-solid fa-lock"></i> Admin
                </button>
                <button type="button" id="btn-logout" class="btn-minimal" style="display: none;">
                    <i class="fa-solid fa-right-from-bracket"></i> ออก
                </button>
            </div>
        </div>

        <div class="back-link-wrap">
            <div class="back-link-left">
                <a href="posts.html" class="back-link">← Back to Posts</a>
                <span class="reading-time-badge" id="reading-time-display"><i class="fa-regular fa-clock"></i> 1 min read</span>
            </div>
            <div class="back-link-right">
                <button type="button" id="btn-share-post" class="btn-minimal" title="แชร์หรือคัดลอกลิงก์บทความ">
                    <i class="fa-solid fa-share-nodes"></i> Share
                </button>
                <div id="single-post-admin-actions" class="admin-card-actions"></div>
            </div>
        </div>

        <article id="single-post-article" class="home-intro">
            <p style="color: var(--text-muted);">กำลังโหลดบทความ...</p>
        </article>
    </main>

    <!-- Modal สำหรับล็อกอิน -->
    <div id="login-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 class="modal-title">Admin Login</h3>
                <button type="button" id="btn-close-login" class="modal-close">&times;</button>
            </div>

            <p id="login-error" class="form-error"></p>

            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-minimal primary" style="width: 100%; justify-content: center; padding: 9px;">
                    เข้าสู่ระบบด้วย Email
                </button>
            </form>

            <div class="modal-divider">— หรือ —</div>

            <button type="button" id="btn-google-login" class="btn-minimal" style="width: 100%; justify-content: center; padding: 9px;">
                <i class="fa-brands fa-google"></i> เข้าสู่ระบบด้วย Google
            </button>
        </div>
    </div>

    <!-- Modal สำหรับแก้ไขบทความ + แนบรูปภาพ -->
    <div id="post-modal" class="modal-overlay">
        <div class="modal-box wide">
            <div class="modal-header">
                <h3 id="post-modal-title" class="modal-title">แก้ไขบทความ</h3>
                <button type="button" id="btn-close-post" class="modal-close">&times;</button>
            </div>

            <form id="post-form">
                <input type="hidden" id="post-id">
                <div class="form-group">
                    <label for="post-title-input">หัวข้อบทความ</label>
                    <input type="text" id="post-title-input" class="form-input" required>
                </div>

                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="post-date-input">วันที่แสดงผล (เช่น May 24)</label>
                        <input type="text" id="post-date-input" class="form-input" required>
                    </div>
                    <div class="form-group" style="width: 120px;">
                        <label for="post-year-input">ปี (ค.ศ.)</label>
                        <input type="text" id="post-year-input" class="form-input" value="2026" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="post-content-input">เนื้อหาบทความ (รองรับ Markdown / เว้นบรรทัด)</label>
                    <textarea id="post-content-input" class="form-input" rows="8" required></textarea>
                    <small style="color: var(--text-muted); font-size: 0.76rem; display: block; margin-top: 5px;">💡 รองรับ Markdown: <code># หัวข้อ</code>, <code>**ตัวหนา**</code>, <code>`โค้ด`</code>, <code>```บล็อกโค้ด```</code>, <code>- รายการ</code>, <code>[ลิงก์](url)</code></small>
                </div>

                <div class="form-group">
                    <label>รูปภาพประกอบบทความ (เลือกได้หลายรูป)</label>
                    <div class="image-upload-bar">
                        <label for="post-image-file" class="btn-minimal" style="cursor: pointer; margin-bottom: 0;">
                            <i class="fa-regular fa-image"></i> เลือกรูปจากเครื่อง
                        </label>
                        <input type="file" id="post-image-file" accept="image/*" multiple style="display: none;">
                    </div>
                    <div id="post-image-preview-list" class="image-preview-list"></div>
                </div>

                <button type="submit" class="btn-minimal primary" style="width: 100%; justify-content: center; padding: 10px; margin-top: 6px;">
                    บันทึกบทความ
                </button>
            </form>
        </div>
    </div>

    <script type="module" src="firebase-projects.js?v=18"></script>
</body>
</html>
